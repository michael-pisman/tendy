name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
      - name: Install dependencies
        run: |
          cd frontend/myapp
          flutter pub get
      - name: Run tests
        run: |
          cd frontend/myapp
          flutter test --no-pub
      - name: Build web
        run: |
          cd frontend/myapp
          flutter build web
