version: "3.8"

services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    volumes:
      - ./backend:/srv/backend
    working_dir: /srv/backend
    command: uvicorn app.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/tendy
    depends_on:
      - mongo

  frontend:
    image: cirrusci/flutter:stable
    working_dir: /workspace/frontend
    volumes:
      - ./frontend/myapp:/workspace/frontend
    ports:
      - "5000:5000"
    command: bash -lc "flutter pub get && flutter run -d web-server --web-hostname 0.0.0.0 --web-port 5000"

volumes:
  mongo_data:
